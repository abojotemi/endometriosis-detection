{% extends "base.html" %}

{% block content %}
<div class="content-area create-patient">

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, msg in messages %}
                <div class="alert alert-{{ category }}">
                    {{ msg }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <!-- Form -->
    <div class="form-container">
        <form method="POST" action="{{ url_for('doctor.create_patient') }}" class="patient-form">

            <div class="form-row">
                <div class="form-group">
                    <label>Full Name <span class="required">*</span></label>
                    <input type="text" name="full_name" required placeholder="Enter patient's full name">
                </div>

                <div class="form-group">
                    <label>Age <span class="required">*</span></label>
                    <input type="number" name="age" required min="1" max="120" placeholder="Enter age">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Gender <span class="required">*</span></label>
                    <select name="gender" required>
                        <option value="Female">Female</option>
                        <option value="Male">Male</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Contact Number <span class="required">*</span></label>
                    <input type="tel" name="contact" required placeholder="Enter contact number">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" placeholder="Enter email address">
                </div>

                <div class="form-group">
                    <label>Address</label>
                    <input type="text" name="address" placeholder="Enter address">
                </div>
            </div>

            <div class="form-group full-width">
                <label>Medical History</label>
                <textarea name="medical_history" rows="4"
                          placeholder="Enter medical history"></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">Create Patient</button>
                <button type="reset" class="btn-secondary">Reset Form</button>
                <a href="{{ url_for('doctor.manage_patients') }}" class="btn-outline">
                    View All Patients
                </a>
            </div>

        </form>
    </div>
</div>

<style>
/* ================= BASE ================= */
.create-patient {
    font-family: 'Roboto', sans-serif;
    font-size: 11px;
}

/* ================= ALERTS ================= */
.alert {
    padding: 12px 15px;
    border-radius: 8px;
    margin-bottom: 20px;
    font-size: 11px;
}

.alert-success {
    background: #d4edda;
    color: #155724;
}

.alert-danger {
    background: #f8d7da;
    color: #721c24;
}

/* ================= FORM ================= */
.form-container {
    background: white;
    padding: 25px;
    border-radius: 14px;
}

.patient-form {
    max-width: 1100px;
    margin: auto;
}

.form-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
    margin-bottom: 20px;
}

.form-group {
    display: flex;
    flex-direction: column;
}

.form-group.full-width {
    grid-column: 1 / -1;
}

.form-group label {
    margin-bottom: 6px;
    font-weight: 500;
    color: #333;
}

.required {
    color: #dc3545;
}

/* ================= INPUTS ================= */
.form-group input,
.form-group select,
.form-group textarea {
    padding: 12px 14px;
    border-radius: 8px;
    border: 1.8px solid #ddd;
    font-size: 11px;
    transition: all 0.3s ease;
    background: #fafafa;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
    outline: none;
    border-color: #6288BD;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(98, 136, 189, 0.15);
}

/* ================= BUTTONS ================= */
.form-actions {
    display: flex;
    gap: 12px;
    margin-top: 25px;
    flex-wrap: wrap;
}

.btn-primary {
    background: #7FA0D6;
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
    font-size: 11px;
}

.btn-primary:hover {
    background: #6288BD;
    transform: translateY(-2px);
}

.btn-secondary {
    background: #6c757d;
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
    font-size: 11px;
}

.btn-secondary:hover {
    background: #545b62;
}

.btn-outline {
    padding: 11px 22px;
    border-radius: 8px;
    border: 1.8px solid #6288BD;
    color: #6288BD;
    text-decoration: none;
    font-size: 11px;
    transition: all 0.3s ease;
}

.btn-outline:hover {
    background: rgba(98, 136, 189, 0.1);
}

/* ================= RESPONSIVE ================= */
@media (max-width: 1024px) {
    .form-container {
        padding: 20px;
    }

    .form-row {
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
    }
}

@media (max-width: 768px) {
    .form-container {
        padding: 18px 15px;
        margin: 15px 12px;
        border-radius: 12px;
    }

    .patient-form {
        max-width: 100%;
    }

    .form-row {
        grid-template-columns: 1fr;
        gap: 15px;
        margin-bottom: 15px;
    }

    .form-group label {
        font-size: 10px;
        margin-bottom: 5px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
        padding: 10px 12px;
        font-size: 10px;
    }

    .form-actions {
        flex-direction: column;
        gap: 10px;
        margin-top: 20px;
    }

    .btn-primary,
    .btn-secondary,
    .btn-outline {
        width: 100%;
        text-align: center;
        padding: 11px 16px;
        font-size: 10px;
    }

    .alert {
        padding: 10px 12px;
        font-size: 10px;
        margin: 15px 12px 15px 12px;
    }
}

@media (max-width: 480px) {
    .form-container {
        padding: 15px 12px;
        margin: 12px 10px;
        border-radius: 10px;
    }

    .form-row {
        gap: 12px;
        margin-bottom: 12px;
    }

    .form-group label {
        font-size: 9px;
        margin-bottom: 4px;
        font-weight: 500;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
        padding: 8px 10px;
        font-size: 9px;
    }

    .form-actions {
        flex-direction: column;
        gap: 8px;
        margin-top: 16px;
    }

    .btn-primary,
    .btn-secondary,
    .btn-outline {
        padding: 9px 14px;
        font-size: 9px;
        border-radius: 6px;
    }

    .alert {
        padding: 8px 10px;
        font-size: 9px;
        margin: 12px 10px;
        border-radius: 6px;
    }
}
</style>
{% endblock %}
