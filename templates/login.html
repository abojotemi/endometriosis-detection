<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .slideshow-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            animation: slideShow 20s infinite;
        }
        
        .slide:nth-child(1) {
            background-image: url("{{ url_for('static', filename='images/bg-img5.jpg') }}");
            animation-delay: 0s;
        }
        
        .slide:nth-child(2) {
            background-image: url("{{ url_for('static', filename='images/bg-img2.jpg') }}");
            animation-delay: 5s;
        }
        
        .slide:nth-child(3) {
            background-image: url("{{ url_for('static', filename='images/bg-img3.jpg') }}");
            animation-delay: 10s;
        }
        
        .slide:nth-child(4) {
            background-image: url("{{ url_for('static', filename='images/bg-img4.jpg') }}");
            animation-delay: 15s;
        }
        
        @keyframes slideShow {
            0% {
                opacity: 0;
                transform: translateX(100%);
            }
            5% {
                opacity: 1;
                transform: translateX(0);
            }
            20% {
                opacity: 1;
                transform: translateX(0);
            }
            25% {
                opacity: 0;
                transform: translateX(-100%);
            }
            100% {
                opacity: 0;
                transform: translateX(-100%);
            }
        }
        
        /* Overlay to improve text readability */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            z-index: -1;
        }
        
        /* Adjust container for better visibility */
        .container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
        }
        
        /* Update body background */
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            font-size: 11px;
            background: rgba(255, 255, 255, 0.9);
            overflow-x: hidden;
        }
        
        /* Input icons styling */
        .input-with-icon {
            position: relative;
            margin: 15px 0;
        }
        
        .input-with-icon i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: darkorange;
            font-size: 10px;
            z-index: 2;
        }
        
        .input-with-icon input {
            width: 100%;
            padding: 12px 12px 12px 45px;
            border-radius: 20px;
            border: none;
            box-sizing: border-box;
            font-size: 14px;
        }
       
        /* Modern glassy white background for right panel */
        .right-panel {
            width: 50%;
            padding: 60px;
            background: rgba(255, 255, 255, 0.95);
            color: #2864bd;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 
                inset 0 0 20px rgba(255, 255, 255, 0.8),
                0 8px 32px rgba(31, 38, 135, 0.15);
        }
        
        /* Update button to match new color scheme */
        .right-panel button {
            width: 100%;
            padding: 12px;
            background: #2864bd;
            color: white;
            border-radius: 20px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .right-panel button:hover {
            background: #1d4a8a;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(40, 100, 189, 0.3);
        }
        
        /* Update links color */
        .right-panel a {
            color: #2864bd;
            font-weight: bold;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        
        .right-panel a:hover {
            color: darkorange;
            text-decoration: underline;
        }
        
        /* Update input styling for new background */
        .right-panel input {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(40, 100, 189, 0.2);
            color: #333;
            transition: all 0.3s ease;
        }
        
        .right-panel input:focus {
            outline: none;
            border-color: #2864bd;
            box-shadow: 0 0 0 3px rgba(40, 100, 189, 0.1);
        }
        
        /* Responsive design */
        @media (max-width: 1024px) {
            .container {
                width: 90%;
                margin: 30px auto;
            }
            
            .left-panel, .right-panel {
                padding: 40px;
            }
        }
        
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                width: 85%;
                margin: 20px auto;
            }
            
            .left-panel, .right-panel {
                width: 100%;
                padding: 30px;
            }
            
            .left-panel {
                padding-bottom: 20px;
            }
            
            .right-panel {
                padding-top: 20px;
                border-left: none;
                border-top: 1px solid rgba(255, 255, 255, 0.3);
            }
            
            h1 {
                font-size: 24px;
            }
            
            h2 {
                font-size: 20px;
            }
        }
        
        @media (max-width: 480px) {
            .container {
                width: 92%;
                margin: 15px auto;
                border-radius: 15px;
            }
            
            .left-panel, .right-panel {
                padding: 25px 20px;
            }
            
            h1 {
                font-size: 22px;
            }
            
            h2 {
                font-size: 18px;
            }
            
            .input-with-icon input {
                padding: 10px 10px 10px 40px;
                font-size: 13px;
            }
            
            .input-with-icon i {
                font-size: 14px;
                left: 12px;
            }
            
            button {
                padding: 10px;
                font-size: 13px;
            }
        }
        
        /* Mobile-specific: disable slideshow, use static bg-img2 */
        @media (max-width: 768px) {
            .slideshow-container {
                display: none;
            }
            
            body::before {
                content: '';
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-image: url("{{ url_for('static', filename='images/bg-img2.jpg') }}");
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                z-index: -3;
            }
            
            body::after {
                content: '';
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.4);
                z-index: -2;
            }
            
            .container {
                background: rgba(255, 255, 255, 0.95);
            }
        }
    </style>
</head>
<body>
    <!-- Background Slideshow -->
    <div class="slideshow-container">
        <div class="slide"></div>
        <div class="slide"></div>
        <div class="slide"></div>
        <div class="slide"></div>
        <div class="overlay"></div>
    </div>

    <div class="container">
        <div class="left-panel">
            <h1>Endometriosis <span>Detector</span></h1>
            <p>Advanced Endometriosis Detection System</p>
            <img src="/static/images/sethoscope2-removebg-preview.png" alt="" width="250">
        </div>

        <div class="right-panel">
            <h2>Login Now!</h2>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, msg in messages %}
                        <div class="alert {{ category }}">{{ msg }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" >
                <div class="input-with-icon">
                    <i class="fas fa-envelope"></i>
                    <input type="email" name="email" placeholder="Email" required />
                </div>
                
                <div class="input-with-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" placeholder="Password" required />
                </div>

                <button type="submit">LOGIN</button>
            </form>

            <p>Don't have an account? <a href="{{ url_for('auth.register') }}">Create Account</a></p>
        </div>
    </div>

    <script>
        // Fallback for browsers that don't support CSS animations
        document.addEventListener('DOMContentLoaded', function() {
            const slides = document.querySelectorAll('.slide');
            let currentSlide = 0;
            
            // Check if CSS animations are supported
            const animationSupport = 'animation' in document.documentElement.style ||
                                    'webkitAnimation' in document.documentElement.style;
            
            if (!animationSupport) {
                // Manual slideshow fallback
                function showSlide(index) {
                    slides.forEach(slide => {
                        slide.style.opacity = 0;
                        slide.style.transform = 'translateX(100%)';
                    });
                    
                    slides[index].style.opacity = 1;
                    slides[index].style.transform = 'translateX(0)';
                    slides[index].style.transition = 'all 1s ease-in-out';
                }
                
                showSlide(0);
                
                setInterval(() => {
                    currentSlide = (currentSlide + 1) % slides.length;
                    showSlide(currentSlide);
                }, 5000);
            }
            
            // Disable slideshow on mobile (redundant with CSS but ensures performance)
            function checkMobile() {
                if (window.innerWidth <= 768) {
                    // Stop any animations if running
                    slides.forEach(slide => {
                        slide.style.animationPlayState = 'paused';
                    });
                }
            }
            
            checkMobile();
            window.addEventListener('resize', checkMobile);
        });
    </script>
</body>
</html>
